<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>集团工厂生产管制塔</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #081017;
      --surface: #0f1922;
      --surface-2: #14212c;
      --surface-3: #192a36;
      --line: #2a3b47;
      --line-strong: #3c5260;
      --text: #edf4f7;
      --muted: #94a7b2;
      --cyan: #18b8d8;
      --cyan-soft: #0e7187;
      --green: #54d49a;
      --yellow: #f4c95d;
      --red: #ff6b72;
      --blue: #4d8fe8;
      --purple: #a389e8;
      --node-w: clamp(76px, 5.35vw, 104px);
      --node-h: 88px;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      letter-spacing: 0;
    }

    button,
    input,
    select { font: inherit; }

    button { color: inherit; }

    .app {
      min-width: 1280px;
      height: 100vh;
      padding: 14px 18px 16px;
      display: grid;
      grid-template-rows: 64px 118px minmax(0, 1fr);
      gap: 12px;
      background:
        linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px),
        var(--bg);
      background-size: 34px 34px;
    }

    .topbar {
      display: grid;
      grid-template-columns: auto minmax(360px, 1fr) auto;
      align-items: center;
      gap: 20px;
      padding: 0 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(15, 25, 34, .96);
    }

    .brand-lockup {
      height: 42px;
      min-width: 338px;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      gap: 13px;
      border-radius: 6px;
      background: #f8fbfc;
    }

    .brand-lockup img { display: block; object-fit: contain; }
    .brand-matsuoka { width: 174px; height: 31px; }
    .brand-divider { width: 1px; height: 25px; background: #c8d4db; }
    .brand-hannao { width: 128px; height: 25px; }

    .title-block { min-width: 0; }
    .title-block h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.15;
      font-weight: 700;
      white-space: nowrap;
    }

    .title-meta {
      margin-top: 5px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .demo-tag,
    .status-chip,
    .filter-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 24px;
      border-radius: 4px;
      white-space: nowrap;
    }

    .demo-tag {
      padding: 0 7px;
      color: #071217;
      background: var(--yellow);
      font-weight: 700;
    }

    .time-panel {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .time-item { text-align: right; }
    .time-label { color: var(--muted); font-size: 11px; }
    .time-value { margin-top: 3px; font-size: 14px; font-weight: 650; }
    .clock { color: var(--cyan); font-variant-numeric: tabular-nums; }

    .factory-overview {
      display: grid;
      grid-template-columns: 170px repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .overview-heading {
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .overview-heading h2 { margin: 0; font-size: 15px; }
    .overview-heading strong { display: block; margin-top: 5px; font-size: 28px; }
    .overview-heading span { color: var(--muted); font-size: 11px; line-height: 1.55; }

    .factory-card {
      position: relative;
      min-width: 0;
      padding: 12px 14px;
      display: grid;
      grid-template-columns: 150px minmax(0, 1fr) 96px;
      align-items: center;
      gap: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      text-align: left;
      cursor: pointer;
      transition: border-color .18s ease, background .18s ease;
    }

    .factory-card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 12px;
      bottom: 12px;
      width: 3px;
      border-radius: 0 2px 2px 0;
      background: var(--risk-color, var(--green));
    }

    .factory-card:hover { border-color: var(--line-strong); background: var(--surface-2); }
    .factory-card.active { border-color: var(--cyan); background: #10232d; box-shadow: inset 0 0 0 1px rgba(24,184,216,.18); }
    .factory-card:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

    .factory-name-row { display: flex; align-items: center; gap: 8px; }
    .factory-name { font-size: 18px; font-weight: 720; white-space: nowrap; }
    .factory-rank { color: var(--muted); font-size: 11px; }
    .factory-state { margin-top: 9px; display: inline-flex; align-items: center; gap: 6px; color: var(--risk-color); font-size: 12px; font-weight: 650; }
    .risk-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 9px currentColor; }

    .factory-kpis { display: grid; grid-template-columns: repeat(4, 1fr); min-width: 0; }
    .factory-kpi { min-width: 0; padding: 0 12px; border-left: 1px solid var(--line); }
    .factory-kpi-label { color: var(--muted); font-size: 11px; }
    .factory-kpi-value { margin-top: 5px; font-size: 21px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .factory-kpi-value small { margin-left: 2px; color: var(--muted); font-size: 11px; font-weight: 500; }

    .factory-alerts { text-align: center; }
    .alert-number { color: var(--risk-color); font-size: 26px; font-weight: 760; font-variant-numeric: tabular-nums; }
    .alert-caption { margin-top: 2px; color: var(--muted); font-size: 11px; }
    .view-hint { margin-top: 7px; color: var(--cyan); font-size: 11px; }

    .workspace {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 324px;
      gap: 12px;
    }

    .process-section,
    .detail-panel {
      min-height: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
    }

    .process-section {
      display: grid;
      grid-template-rows: 52px minmax(0, 1fr);
      overflow: hidden;
    }

    .process-toolbar {
      padding: 0 12px 0 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--line);
    }

    .active-factory { min-width: 180px; }
    .active-factory strong { display: block; font-size: 15px; }
    .active-factory span { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; }

    .toolbar-spacer { flex: 1; }

    .search-wrap { position: relative; width: 174px; }
    .search-wrap input {
      width: 100%;
      height: 32px;
      padding: 0 10px 0 30px;
      border: 1px solid var(--line);
      border-radius: 5px;
      outline: none;
      background: #0b141b;
      color: var(--text);
      font-size: 12px;
    }

    .search-wrap input:focus { border-color: var(--cyan); }
    .search-mark { position: absolute; left: 10px; top: 7px; color: var(--muted); font-size: 13px; }

    select {
      height: 32px;
      padding: 0 28px 0 9px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: #0b141b;
      color: var(--text);
      font-size: 12px;
      outline: none;
    }

    select:focus { border-color: var(--cyan); }

    .zoom-controls { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
    .icon-button {
      width: 32px;
      height: 30px;
      border: 0;
      border-right: 1px solid var(--line);
      background: #0b141b;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
    }

    .icon-button:last-child { border-right: 0; }
    .icon-button:hover { background: var(--surface-3); color: var(--cyan); }
    .icon-button:focus-visible { outline: 2px solid var(--cyan); outline-offset: -2px; }

    .process-viewport {
      position: relative;
      min-height: 0;
      overflow: hidden;
      background: #0a141b;
      touch-action: none;
      cursor: grab;
    }

    .process-viewport.dragging { cursor: grabbing; }

    .flow-content {
      position: absolute;
      inset: 0;
      transform-origin: center center;
      transition: transform .16s ease;
    }

    .phase-strip {
      position: absolute;
      top: 15px;
      left: 18px;
      right: 18px;
      height: 24px;
      display: grid;
      grid-template-columns: 3fr 3fr 3fr 3fr 3fr 3fr 3fr;
      gap: 5px;
      z-index: 3;
    }

    .phase-label {
      display: flex;
      align-items: center;
      justify-content: center;
      border-top: 2px solid var(--phase-color);
      color: var(--muted);
      font-size: 10px;
      background: color-mix(in srgb, var(--phase-color) 9%, transparent);
    }

    #edgeLayer { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; z-index: 1; }
    .flow-edge { fill: none; stroke: #2a515d; stroke-width: 2; vector-effect: non-scaling-stroke; }
    .flow-edge.active { stroke: var(--cyan); stroke-width: 3; filter: drop-shadow(0 0 4px rgba(24,184,216,.8)); }
    .flow-edge.dimmed { opacity: .15; }

    .node-layer { position: absolute; inset: 0; z-index: 2; }

    .process-node {
      position: absolute;
      width: var(--node-w);
      height: var(--node-h);
      padding: 9px 9px 8px;
      border: 1px solid var(--line-strong);
      border-top: 3px solid var(--risk-color);
      border-radius: 6px;
      background: #14212a;
      cursor: pointer;
      text-align: left;
      box-shadow: 0 5px 12px rgba(0,0,0,.16);
      transition: transform .16s ease, border-color .16s ease, opacity .16s ease, background .16s ease;
    }

    .process-node::after {
      content: "";
      position: absolute;
      right: 6px;
      bottom: 6px;
      width: 7px;
      height: 7px;
      border: 2px solid #14212a;
      border-radius: 50%;
      background: var(--risk-color);
    }

    .process-node:hover { transform: translateY(-3px); border-color: var(--risk-color); background: #192b36; }
    .process-node.selected { border-color: var(--cyan); box-shadow: 0 0 0 2px rgba(24,184,216,.22), 0 8px 18px rgba(0,0,0,.28); }
    .process-node.dimmed { opacity: .18; }
    .process-node.filtered { display: none; }
    .process-node:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

    .node-topline { display: flex; align-items: center; justify-content: space-between; gap: 5px; }
    .node-no { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); font-size: 10px; font-variant-numeric: tabular-nums; }
    .node-no::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--role-color); }
    .progress-mark { width: 17px; height: 5px; border-radius: 2px; background: #43535d; }
    .progress-mark.completed { background: var(--green); }
    .progress-mark.active { background: var(--cyan); box-shadow: 0 0 7px rgba(24,184,216,.7); }
    .progress-mark.pending { background: #46545c; }
    .node-label { min-height: 31px; margin-top: 7px; font-size: 12px; line-height: 1.25; font-weight: 650; overflow-wrap: anywhere; }
    .node-metric { margin-top: 5px; color: var(--muted); font-size: 10px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .center-insight {
      position: absolute;
      left: 50%;
      top: 29%;
      width: min(860px, 72%);
      transform: translate(-50%, -48%);
      z-index: 2;
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      gap: 16px;
      pointer-events: none;
    }

    .shift-summary,
    .alert-summary {
      min-height: 132px;
      padding: 14px 16px;
      border-top: 1px solid var(--line-strong);
      border-bottom: 1px solid var(--line-strong);
      background: rgba(15, 25, 34, .88);
    }

    .center-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .center-title strong { font-size: 13px; }
    .center-title span { color: var(--muted); font-size: 10px; }
    .summary-grid { margin-top: 13px; display: grid; grid-template-columns: repeat(4, 1fr); }
    .summary-item { padding: 0 12px; border-left: 1px solid var(--line); }
    .summary-item:first-child { padding-left: 0; border-left: 0; }
    .summary-item label { display: block; color: var(--muted); font-size: 10px; }
    .summary-item strong { display: block; margin-top: 6px; font-size: 20px; font-variant-numeric: tabular-nums; }
    .summary-item small { margin-left: 2px; color: var(--muted); font-size: 10px; }

    .alert-list { margin-top: 9px; display: grid; gap: 7px; }
    .alert-row { display: grid; grid-template-columns: 8px minmax(0, 1fr) auto; align-items: center; gap: 9px; }
    .alert-row .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--alert-color); box-shadow: 0 0 7px var(--alert-color); }
    .alert-row strong { min-width: 0; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .alert-row time { color: var(--muted); font-size: 10px; font-variant-numeric: tabular-nums; }

    .empty-result {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 6;
      padding: 18px 24px;
      transform: translate(-50%, -50%);
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #101b24;
      text-align: center;
      display: none;
    }

    .empty-result strong { display: block; font-size: 14px; }
    .empty-result span { display: block; margin-top: 6px; color: var(--muted); font-size: 11px; }

    .legend {
      position: absolute;
      right: 15px;
      bottom: 12px;
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 13px;
      color: var(--muted);
      font-size: 10px;
    }

    .legend-item { display: flex; align-items: center; gap: 5px; }
    .legend-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--legend-color); }
    .legend-bar { width: 14px; height: 4px; border-radius: 2px; background: var(--legend-color); }

    .detail-panel {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      overflow: hidden;
    }

    .detail-header { padding: 15px 16px 12px; border-bottom: 1px solid var(--line); }
    .detail-eyebrow { color: var(--cyan); font-size: 10px; font-weight: 700; text-transform: uppercase; }
    .detail-title-row { margin-top: 7px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .detail-title-row h2 { margin: 0; font-size: 18px; line-height: 1.25; }
    .detail-index { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }

    .status-row { margin-top: 11px; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
    .status-chip { padding: 0 8px; color: var(--chip-color); border: 1px solid color-mix(in srgb, var(--chip-color) 45%, transparent); background: color-mix(in srgb, var(--chip-color) 9%, transparent); font-size: 10px; }

    .detail-content { min-height: 0; padding: 0 16px 16px; overflow: auto; scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
    .detail-section { padding: 14px 0; border-bottom: 1px solid var(--line); }
    .detail-section:last-child { border-bottom: 0; }
    .section-label { margin-bottom: 9px; color: var(--muted); font-size: 10px; text-transform: uppercase; }
    .detail-description { margin: 0; color: #d5e1e6; font-size: 12px; line-height: 1.65; }

    .metric-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .metric-box { min-width: 0; padding: 10px; border-left: 2px solid var(--box-color, var(--cyan)); background: #0b151c; }
    .metric-box label { display: block; color: var(--muted); font-size: 10px; }
    .metric-box strong { display: block; margin-top: 5px; font-size: 18px; font-variant-numeric: tabular-nums; }
    .metric-box small { color: var(--muted); font-size: 9px; }

    .definition-list { margin: 0; display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 8px 10px; font-size: 11px; line-height: 1.45; }
    .definition-list dt { color: var(--muted); }
    .definition-list dd { margin: 0; overflow-wrap: anywhere; }

    .rule-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 7px; }
    .rule-list li { position: relative; padding-left: 13px; color: #d5e1e6; font-size: 11px; line-height: 1.45; }
    .rule-list li::before { content: ""; position: absolute; left: 0; top: 6px; width: 5px; height: 5px; border-radius: 50%; background: var(--cyan); }

    .exception-box { padding: 10px 11px; border-left: 3px solid var(--red); background: rgba(255,107,114,.08); }
    .exception-box strong { display: block; color: var(--red); font-size: 11px; }
    .exception-box p { margin: 6px 0 0; color: #e9d5d7; font-size: 11px; line-height: 1.5; }
    .exception-box.normal { border-left-color: var(--green); background: rgba(84,212,154,.07); }
    .exception-box.normal strong { color: var(--green); }

    .detail-footer { padding: 11px 16px; border-top: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-size: 10px; }
    .data-source { display: inline-flex; align-items: center; gap: 6px; }
    .data-source::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--yellow); }

    @media (max-height: 820px) {
      .app { padding-top: 10px; padding-bottom: 10px; grid-template-rows: 58px 106px minmax(0, 1fr); gap: 9px; }
      .topbar { padding: 0 12px; }
      .brand-lockup { height: 38px; }
      .factory-overview { grid-template-columns: 150px repeat(2, minmax(0, 1fr)); }
      .factory-card { padding-top: 9px; padding-bottom: 9px; }
      .process-section { grid-template-rows: 46px minmax(0, 1fr); }
      .process-node { height: 78px; }
      .center-insight { width: min(780px, 68%); }
      .shift-summary, .alert-summary { min-height: 116px; padding-top: 11px; padding-bottom: 11px; }
      .detail-section { padding: 10px 0; }
    }

    @media (max-width: 1500px) {
      :root { --node-w: 68px; }
      .workspace { grid-template-columns: minmax(0, 1fr) 280px; }
      .factory-card { grid-template-columns: 132px minmax(0, 1fr) 78px; gap: 9px; }
      .factory-kpi { padding: 0 7px; }
      .factory-kpi-value { font-size: 18px; }
      .node-label { font-size: 10px; line-height: 1.2; }
      .node-metric { display: none; }
      .center-insight { width: min(680px, 72%); }
      .summary-item { padding: 0 7px; }
      .summary-item strong { font-size: 17px; }
    }

    /* Visual language aligned with the IMBD sewing team dashboard reference. */
    :root {
      --bg: #04182a;
      --surface: #092d50;
      --surface-2: #0d3a67;
      --surface-3: #124778;
      --line: #245c91;
      --line-strong: #3c83bb;
      --text: #f5fbff;
      --muted: #a9c7df;
      --cyan: #39e4ef;
      --cyan-soft: #0b9fbd;
      --blue: #0789f5;
      --green: #2ee6bd;
      --yellow: #ffb51b;
      --red: #ff3857;
    }

    .app {
      grid-template-rows: 66px 118px minmax(0, 1fr) 34px;
      background:
        linear-gradient(rgba(26, 103, 169, .12) 1px, transparent 1px),
        linear-gradient(90deg, rgba(26, 103, 169, .12) 1px, transparent 1px),
        #04182a;
      background-size: 48px 48px;
    }

    .topbar {
      position: relative;
      grid-template-columns: 350px minmax(430px, 1fr) 300px;
      border-color: #245f97;
      background: #0b2b4c;
      box-shadow: inset 0 -1px 0 rgba(75, 199, 255, .25), 0 5px 18px rgba(0, 7, 18, .28);
    }

    .brand-lockup {
      min-width: 210px;
      padding-left: 2px;
      background: transparent;
    }

    .brand-lockup img {
      filter: brightness(0) invert(1);
      opacity: .98;
    }

    .brand-divider { display: none; }

    .brand-hannao {
      position: absolute;
      top: 50%;
      right: 14px;
      width: 128px;
      height: 25px;
      transform: translateY(-50%);
    }

    .title-block {
      position: relative;
      text-align: center;
      isolation: isolate;
    }

    .title-block h1 {
      font-size: 29px;
      text-shadow: 0 0 14px rgba(123, 211, 255, .58);
    }

    .title-meta { display: none; }
    .clock { color: #7beaff; text-shadow: 0 0 9px rgba(57, 228, 239, .45); }

    .time-panel { justify-content: flex-end; padding-right: 148px; }
    .time-panel .time-item { min-width: 142px; }
    .time-panel .time-item:first-child { display: none; }

    .overview-heading,
    .factory-card,
    .process-section,
    .detail-panel {
      border-color: #28679f;
      background: linear-gradient(135deg, rgba(13, 58, 103, .98), rgba(7, 38, 68, .98));
      box-shadow: inset 0 0 24px rgba(36, 119, 190, .08), 0 7px 18px rgba(0, 8, 21, .24);
    }

    .overview-heading,
    .factory-card {
      position: relative;
      overflow: hidden;
    }

    .overview-heading::after,
    .factory-card::after {
      content: "";
      position: absolute;
      top: 0;
      left: 18px;
      width: 155px;
      height: 18px;
      border-top: 2px solid #4cddff;
      border-right: 2px solid #4cddff;
      border-radius: 0 18px 0 0;
      opacity: .8;
      pointer-events: none;
    }

    .overview-heading h2,
    .factory-name { font-style: italic; }

    .process-node {

    .process-node.risk-warning .node-no {

      content: "";
      position: absolute;
      inset: -7px;

    .process-node.risk-danger .node-no {

    .process-node.risk-danger .node-no::after {

    @keyframes node-risk-pulse {

    /* Layered status motion: keep risk legible while limiting continuous movement. */
    .process-node.progress-completed:not(.risk-warning):not(.risk-danger) .node-no {
      border-color: rgba(46, 230, 189, .82);

      width: 9px;
      height: 9px;
      display: none;
      border: 1px solid #4a0618;
      border-radius: 2px;
      background: #ff3857;
      box-shadow: 0 0 8px rgba(255, 56, 87, .9);
      transform: rotate(45deg);
    }

    .process-node.risk-danger .risk-corner { display: block; }

    .process-node.risk-warning .node-no::after {
      animation-duration: 2.5s;
    }

    .flow-edge.edge-warning {
      stroke: #f4c95d;
      filter: drop-shadow(0 0 4px rgba(244, 201, 93, .62));
    }

    .flow-edge-stream.edge-warning {
      stroke: rgba(255, 216, 104, .9);
      filter: drop-shadow(0 0 5px rgba(244, 201, 93, .78));
      animation-duration: 1.6s;
    }

    .flow-edge.edge-danger {
      stroke: #ff3857;
      filter: drop-shadow(0 0 5px rgba(255, 56, 87, .78));
    }

    .flow-edge-stream.edge-danger {
      stroke: rgba(255, 92, 111, .94);
      filter: drop-shadow(0 0 6px rgba(255, 56, 87, .86));
      animation-duration: 2.2s;
    }

    .flow-edge.edge-warning.active,
    .flow-edge.edge-danger.active {
      stroke-width: 4;
    }

    .flow-edge-stream.edge-warning.active,
    .flow-edge-stream.edge-danger.active {
      stroke-width: 3;
      stroke-dasharray: 5 13;
      animation-duration: 1.1s;
    }

    .flow-edge-stream.edge-danger.active { animation-duration: 1.35s; }

    @keyframes node-active-breathe {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 7px rgba(57, 228, 239, .42)); }
      50% { transform: scale(1.02); filter: drop-shadow(0 0 13px rgba(57, 228, 239, .72)); }
    }

    @keyframes node-selected-glow {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 7px rgba(116, 233, 255, .56)); }
      50% { transform: scale(1.018); filter: drop-shadow(0 0 14px rgba(116, 233, 255, .96)); }
    }

    @keyframes node-refresh-sweep {
      0% { transform: scale(1); filter: brightness(1); }
      35% { transform: scale(1.04); filter: brightness(1.55) drop-shadow(0 0 12px rgba(213, 251, 255, .9)); }
      100% { transform: scale(1); filter: brightness(1); }
    }

    @keyframes data-refresh-flash {
      0% { opacity: 1; text-shadow: none; }
      35% { opacity: .72; text-shadow: 0 0 12px currentColor; }
      100% { opacity: 1; text-shadow: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .process-node.risk-warning .node-no::after,
      .process-node.risk-danger .node-no::after,
      .flow-edge-stream,
      .process-node.progress-active .node-no,
      .process-node.selected .node-no,
      .process-node.is-refreshing .node-no,
      .process-node.is-refreshing .progress-mark,
      .detail-panel.is-refreshing .detail-title-row h2,
      .detail-panel.is-refreshing .metric-box strong {
        animation: none;
      }
    }
  </style>
</head>

    function buildNodes(factoryKey, sourceNodes = baseNodes) {
      const isIbmd = factoryKey === "ibmd";
      return sourceNodes.map((node, index) => {
        const completedUntil = isIbmd ? 16 : Math.min(20, sourceNodes.length - 1);
        const progress = index < completedUntil ? "completed" : index < completedUntil + 8 ? "active" : "pending";
        const ratioBase = isIbmd ? 0.82 : 0.91;
        const variance = ((index % 5) - 2) * 0.025;
        let ratio = Math.max(.48, Math.min(.98, ratioBase + variance));
        let risk = "normal";
        let exception = "当前运行正常，未发现需要升级处理的异常。";

        if (isIbmd && node.label === "面辅检验") {
          risk = "warning"; ratio = .76; exception = "面料 A 检验待处理数量偏高，建议核对检验结果和在途到货。";
        }
        if (isIbmd && node.label === "PartLine 车缝") {
          risk = "warning"; ratio = .79; exception = "PartLine L7 节拍连续 20 分钟低于计划，当前完成率 79%。";
        }
        if (isIbmd && node.label === "HangerLine 车缝") {
          risk = "danger"; ratio = .50; exception = "HangerLine L2 组立进度降至 50%，已形成后续工序等待。";
        }
        if (isIbmd && node.label === "后道 QC2") {
          risk = "warning"; ratio = .81; exception = "后道终检外观缺陷较上一时段上升，需关注整烫和后道质量稳定性。";
        }
        if (!isIbmd && node.label === "裁片交接") {
          risk = "warning"; ratio = .84; exception = "裁片交接较计划晚 18 分钟，尚未影响车缝主计划。";
        }

        const target = node.target;
        const actual = target === 100 ? Math.round(ratio * 100) : Math.round(target * ratio);
        return { ...node, progress, risk, ratio, actual, exception };
      });
    }

    const factories = {

    function factoryOrder() {
      return Object.values(factories).sort((a, b) => riskMeta[b.overallRisk].weight - riskMeta[a.overallRisk].weight);

    function renderFactoryCards() {
      const orderedFactories = factoryOrder();

    function renderAlerts(factory) {
      const alerts = factory.nodes
        .filter(node => node.risk !== "normal")
        .sort((a,b) => riskMeta[b.risk].weight - riskMeta[a.risk].weight)

      `;
    }

    function renderTicker(factory) {
      const alert = factory.nodes
        .filter(node => node.risk !== "normal")
        .sort((a,b) => riskMeta[b.risk].weight - riskMeta[a.risk].weight)[0];
      document.getElementById("tickerText").textContent = alert
        ? `${factory.name} · ${String(alert.no).padStart(2,"0")} ${alert.label}：${alert.exception}`
        : `${factory.name} · 实时状态暂无需要播报的重点异常`;
      document.getElementById("tickerTime").textContent = factory.updated;
    }

    function rowCountsForNodeCount(nodeCount) {
      return nodeCount === 33 ? [11, 11, 11] : [13, 13, 12];
    }

    function rowIndexForNode(index, rowCounts) {
      let rowStart = 0;
      for (let row = 0; row < rowCounts.length; row += 1) {
        if (index < rowStart + rowCounts[row]) return row;
        rowStart += rowCounts[row];
      }
      return rowCounts.length - 1;
    }

    function nodePosition(index, nodeCount = factories[activeFactoryId].nodes.length) {
      const viewportWidth = viewport.clientWidth;
      const viewportHeight = viewport.clientHeight;
      const rowCounts = rowCountsForNodeCount(nodeCount);
      const nodeWidth = viewportWidth <= 1500 ? 68 : Math.min(104, Math.max(76, viewportWidth * .0535));
      const nodeHeight = viewportHeight < 590 ? 72 : 84;
      const sidePadding = 24;
      const usableWidth = Math.max(320, viewportWidth - sidePadding * 2 - nodeWidth);
      const rowGap = Math.max(96, (viewportHeight - nodeHeight - 122) / 2);
      const rowY = [40, 40 + rowGap, 40 + rowGap * 2];
      const row = rowIndexForNode(index, rowCounts);
      let rowStart = 0;
      for (let i = 0; i < row; i += 1) rowStart += rowCounts[i];
      const positionInRow = index - rowStart;
      const reverse = row === 1;
      const xIndex = reverse ? rowCounts[row] - 1 - positionInRow : positionInRow;
      const rowStepX = usableWidth / (rowCounts[row] - 1);
      return { x:sidePadding + xIndex * rowStepX, y:rowY[row] };
    }

    function renderNodes(factory) {
      const query = nodeSearch.value.trim().toLowerCase();
      const phase = phaseFilter.value;
      const risk = riskFilter.value;
      const nodeCount = factory.nodes.length;
      const rowCounts = rowCountsForNodeCount(nodeCount);
      let visibleCount = 0;

      nodeLayer.innerHTML = factory.nodes.map((node, index) => {
        const pos = nodePosition(index, nodeCount);
        const row = rowIndexForNode(index, rowCounts) + 1;
        const matchesQuery = !query || node.label.toLowerCase().includes(query) || roleMeta[node.role].name.includes(query);
        const matchesPhase = phase === "all" || node.phase === phase;
        const matchesRisk = risk === "all" || node.risk === risk;
        const filtered = !(matchesQuery && matchesPhase && matchesRisk);
        if (!filtered) visibleCount += 1;
        const riskInfo = riskMeta[node.risk];
        const metricValue = node.target === 100 ? `${node.actual}%` : `${node.actual}/${node.target}`;
        return `
          <button class="process-node risk-${node.risk} progress-${node.progress} row-${row} ${node.id === selectedNodeId && !filtered ? "selected" : ""} ${filtered ? "filtered" : ""}"
            type="button" data-node="${node.id}" style="left:${pos.x}px;top:${pos.y}px;--risk-color:${riskInfo.color};--role-color:${roleMeta[node.role].color}"
            aria-label="${node.no} ${node.label}，共 ${nodeCount} 个节点，${progressMeta[node.progress].label}，${riskInfo.label}">
            <span class="node-topline"><span class="node-no">${String(node.no).padStart(2,"0")}</span><i class="progress-mark ${node.progress}" title="${progressMeta[node.progress].label}"></i><i class="risk-corner" aria-hidden="true"></i></span>
            <span class="node-label">${node.label}</span>
            <span class="node-metric">${node.metricLabel} ${metricValue}</span>
          </button>`;
      }).join("");

      document.getElementById("emptyResult").style.display = visibleCount ? "none" : "block";
      nodeLayer.querySelectorAll(".process-node").forEach(button => {
        button.addEventListener("click", event => {
          event.stopPropagation();
          selectedNodeId = button.dataset.node;
          selectNode(selectedNodeId, button, { automatic:false });
        });
      });
    }

    function selectNode(id, trigger = null, { automatic = false, refresh = automatic } = {}) {
      const factory = factories[activeFactoryId];
      const node = factory.nodes.find(item => item.id === id);
      if (!node) return;
      if (!refresh) clearDataRefreshState();
      nodeLayer.querySelectorAll(".process-node").forEach(button => button.classList.toggle("selected", button.dataset.node === id));
      renderDetails(node);
      openDetailDrawer(trigger || nodeLayer.querySelector(`[data-node="${id}"]`), { focus:!automatic, manual:!automatic });
      drawEdges();
      if (refresh) triggerDataRefresh(id);
      if (!automatic) restartAutoCycle();
    }

    function clearDataRefreshState() {
      window.clearTimeout(refreshAnimationTimer);
      refreshAnimationTimer = null;
      nodeLayer.querySelectorAll(".is-refreshing").forEach(button => button.classList.remove("is-refreshing"));
      detailPanel.classList.remove("is-refreshing");
    }

    function triggerDataRefresh(nodeId) {
      clearDataRefreshState();
      const button = nodeLayer.querySelector(`[data-node="${nodeId}"]`);
      if (!button) return;
      button.classList.add("is-refreshing");
      detailPanel.classList.add("is-refreshing");
      refreshAnimationTimer = window.setTimeout(() => {
        button.classList.remove("is-refreshing");
        detailPanel.classList.remove("is-refreshing");
        refreshAnimationTimer = null;
      }, 700);
    }

    function refreshProcessLayout() {
      renderNodes(factories[activeFactoryId]);
      window.requestAnimationFrame(drawEdges);
    }

    function openDetailDrawer(returnFocusTarget = null, { focus = true, manual = true } = {}) {
      if (!manual && detailManuallyHidden) return;
      if (manual) detailManuallyHidden = false;
      if (returnFocusTarget) detailReturnFocus = returnFocusTarget;
      isDetailOpen = true;
      workspace.classList.add("detail-open");
      workspace.classList.remove("detail-collapsed");
      detailPanel.classList.add("is-open");
      detailPanel.setAttribute("aria-hidden", "false");
      detailDrawerTrigger.setAttribute("aria-expanded", "true");
      refreshProcessLayout();
      if (focus) requestAnimationFrame(() => document.getElementById("detailTitle").focus({ preventScroll:true }));
    }

    function visibleNodeButtons() {
      return Array.from(nodeLayer.querySelectorAll(".process-node:not(.filtered)"));
    }

    function showSelectedNodeAutomatically() {
      const visibleButtons = visibleNodeButtons();
      if (!visibleButtons.length) return false;
      const selectedButton = visibleButtons.find(button => button.dataset.node === selectedNodeId) || visibleButtons[0];
      selectedNodeId = selectedButton.dataset.node;
      selectNode(selectedNodeId, selectedButton, { automatic:true, refresh:false });
      return true;
    }

    function advanceAutoCycle() {
      const visibleButtons = visibleNodeButtons();
      if (!visibleButtons.length) {
        closeDetailDrawer({ returnFocus:false, manual:false });
        restartAutoCycle();
        return;
      }
      const currentIndex = visibleButtons.findIndex(button => button.dataset.node === selectedNodeId);
      const nextButton = visibleButtons[(currentIndex + 1 + visibleButtons.length) % visibleButtons.length];
      selectedNodeId = nextButton.dataset.node;
      selectNode(selectedNodeId, nextButton, { automatic:true });
      restartAutoCycle();
    }

    function restartAutoCycle() {
      window.clearTimeout(autoCycleTimer);
      if (document.hidden) return;
      autoCycleTimer = window.setTimeout(advanceAutoCycle, AUTO_CYCLE_MS);
    }

    function closeDetailDrawer({ returnFocus = true, manual = true } = {}) {
      if (manual) detailManuallyHidden = true;
      isDetailOpen = false;
      workspace.classList.remove("detail-open");
      workspace.classList.add("detail-collapsed");
      detailPanel.classList.remove("is-open");
      detailPanel.setAttribute("aria-hidden", "true");
      detailDrawerTrigger.setAttribute("aria-expanded", "false");
      refreshProcessLayout();
      if (returnFocus) {
        const focusTarget = detailReturnFocus && document.body.contains(detailReturnFocus)
          ? detailReturnFocus
          : detailDrawerTrigger;
        focusTarget.focus({ preventScroll:true });
      }
    }

    function renderDetails(node) {
      const factory = factories[activeFactoryId];
      const risk = riskMeta[node.risk];
      const progress = progressMeta[node.progress];
      document.getElementById("detailTitle").textContent = node.label;
      document.getElementById("detailIndex").textContent = `${String(node.no).padStart(2,"0")} / ${factory.nodes.length}`;
      document.getElementById("detailStatus").innerHTML = `
        <span class="status-chip" style="--chip-color:${progress.color}">${progress.label}</span>
        <span class="status-chip" style="--chip-color:${risk.color}">${risk.label}</span>
        <span class="status-chip" style="--chip-color:${roleMeta[node.role].color}">${roleMeta[node.role].name}</span>`;

      const exceptionNormal = node.risk === "normal";
      document.getElementById("detailContent").innerHTML = `
        <section class="detail-section">
          <div class="section-label">节点说明</div>
          <p class="detail-description">${node.description}</p>
        </section>
        <section class="detail-section">
          <div class="section-label">当前完成情况</div>
          <div class="metric-pair">
            <div class="metric-box" style="--box-color:${progress.color}"><label>${node.metricLabel}</label><strong>${node.actual}<small>${node.target === 100 ? "%" : " 件"}</small></strong></div>
            <div class="metric-box" style="--box-color:${risk.color}"><label>计划目标</label><strong>${node.target}<small>${node.target === 100 ? "%" : " 件"}</small></strong></div>
          </div>
        </section>
        <section class="detail-section">
          <div class="section-label">业务信息</div>
          <dl class="definition-list">
            <dt>责任角色</dt><dd>${roleMeta[node.role].name}</dd>
            <dt>输入</dt><dd>${node.input}</dd>
            <dt>输出</dt><dd>${node.output}</dd>
            <dt>汇总口径</dt><dd>按当前实时最严重风险显示</dd>
          </dl>
        </section>
        <section class="detail-section">
          <div class="section-label">当前状态</div>
          <div class="exception-box ${exceptionNormal ? "normal" : ""}">
            <strong>${exceptionNormal ? "运行正常" : `${risk.label}事项`}</strong>
            <p>${node.exception}</p>
          </div>
        </section>
        <section class="detail-section">
          <div class="section-label">关键规则</div>
          <ul class="rule-list">${node.rules.map(rule => `<li>${rule}</li>`).join("")}</ul>
        </section>`;
      document.getElementById("detailUpdated").textContent = `更新于 ${factories[activeFactoryId].updated}`;
      detailDrawerTrigger.style.setProperty("--risk-color", risk.color);
      detailDrawerTrigger.title = `展开${node.label}节点详情`;
      detailDrawerTrigger.setAttribute("aria-label", `展开${node.label}节点详情`);
    }

    function drawEdges() {
      const factory = factories[activeFactoryId];
      const contentRect = flowContent.getBoundingClientRect();
      const rowCounts = rowCountsForNodeCount(factory.nodes.length);
      const turnIndexes = [rowCounts[0] - 1, rowCounts[0] + rowCounts[1] - 1];
      edgeLayer.setAttribute("viewBox", `0 0 ${flowContent.clientWidth} ${flowContent.clientHeight}`);
      const markers = `<defs>
        <marker id="arrowNormal" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 8 4 L 0 8 z" fill="#1f5889" /></marker>
        <marker id="arrowActive" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 8 4 L 0 8 z" fill="#18b8d8" /></marker>
        <marker id="arrowWarning" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 8 4 L 0 8 z" fill="#f4c95d" /></marker>
        <marker id="arrowDanger" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 8 4 L 0 8 z" fill="#ff3857" /></marker>
      </defs>`;
      edgeLayer.innerHTML = markers + factory.nodes.slice(0, -1).map((node, index) => {
        const nextNode = factory.nodes[index + 1];
        const from = nodeLayer.querySelector(`[data-node="${node.id}"]`);
        const to = nodeLayer.querySelector(`[data-node="${nextNode.id}"]`);
        if (!from || !to || from.classList.contains("filtered") || to.classList.contains("filtered")) return "";
        const a = from.querySelector(".node-no").getBoundingClientRect();
        const b = to.querySelector(".node-no").getBoundingClientRect();
        const ax = (a.left - contentRect.left) / scale + a.width / (2 * scale);
        const ay = (a.top - contentRect.top) / scale + a.height / (2 * scale);
        const bx = (b.left - contentRect.left) / scale + b.width / (2 * scale);
        const by = (b.top - contentRect.top) / scale + b.height / (2 * scale);
        const turnIndex = turnIndexes.indexOf(index);
        const isTurn = turnIndex !== -1;
        let path;
        if (isTurn) {
          const direction = turnIndex === 0 ? 1 : -1;
          const radiusX = Math.max(30, flowContent.clientWidth * .12);
          const controlX = ax + direction * radiusX;
          path = `M ${ax} ${ay} C ${controlX} ${ay}, ${controlX} ${by}, ${bx} ${by}`;
        } else {
          const midX = (ax + bx) / 2;
          const amplitude = index % 2 === 0 ? -20 : 20;
          path = `M ${ax} ${ay} C ${midX} ${ay + amplitude}, ${midX} ${by - amplitude}, ${bx} ${by}`;
        }
        const active = node.id === selectedNodeId || nextNode.id === selectedNodeId;
        const edgeRisk = node.risk === "danger" || nextNode.risk === "danger"
          ? "danger"
          : node.risk === "warning" || nextNode.risk === "warning" ? "warning" : "normal";
        const edgeRiskClass = edgeRisk === "normal" ? "" : ` edge-${edgeRisk}`;
        const markerId = edgeRisk === "danger" ? "arrowDanger" : edgeRisk === "warning" ? "arrowWarning" : active ? "arrowActive" : "arrowNormal";
        return `<g class="flow-edge-group">
          <path class="flow-edge ${active ? "active" : ""}${edgeRiskClass}" d="${path}" marker-end="url(#${markerId})" />
          <path class="flow-edge-stream ${active ? "active" : ""}${edgeRiskClass}" d="${path}" />
        </g>`;
      }).join("");
    }

    function applyFilters() {
      clearDataRefreshState();
      renderNodes(factories[activeFactoryId]);
      const selectedButton = nodeLayer.querySelector(`[data-node="${selectedNodeId}"]`);
      if (!selectedButton || selectedButton.classList.contains("filtered")) {
        if (!showSelectedNodeAutomatically()) closeDetailDrawer({ returnFocus:false, manual:false });
      }
      requestAnimationFrame(drawEdges);
      restartAutoCycle();
    }

    function setScale(nextScale) {
      scale = Math.max(.82, Math.min(1.14, nextScale));
      applyTransform();
      requestAnimationFrame(drawEdges);
    }

    function applyTransform() {
      flowContent.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    }

    function resetCanvas() {
      scale = 1;
      panX = 0;
      panY = 0;
      applyTransform();
    }

    nodeSearch.addEventListener("input", applyFilters);
    phaseFilter.addEventListener("change", applyFilters);
    riskFilter.addEventListener("change", applyFilters);
    processToolsToggle.addEventListener("click", () => {
      setProcessToolsOpen(!processSection.classList.contains("tools-open"));
    });
    detailDrawerTrigger.addEventListener("click", () => {
      detailReturnFocus = detailDrawerTrigger;
      openDetailDrawer(detailDrawerTrigger);
    });
    detailClose.addEventListener("click", () => closeDetailDrawer());
    document.getElementById("zoomIn").addEventListener("click", () => setScale(scale + .08));
    document.getElementById("zoomOut").addEventListener("click", () => setScale(scale - .08));
    document.getElementById("resetView").addEventListener("click", () => { resetCanvas(); drawEdges(); });

    viewport.addEventListener("wheel", event => {
      if (!event.ctrlKey && !event.metaKey) return;
      event.preventDefault();
      setScale(scale + (event.deltaY < 0 ? .06 : -.06));
    }, { passive:false });

    viewport.addEventListener("pointerdown", event => {
      if (event.target.closest("button, input, select")) return;
      if (isDetailOpen) closeDetailDrawer({ returnFocus:false });
      isDragging = true;
      dragStart = { x:event.clientX - panX, y:event.clientY - panY };
      viewport.classList.add("dragging");
      viewport.setPointerCapture(event.pointerId);
    });

    viewport.addEventListener("pointermove", event => {
      if (!isDragging) return;
      panX = Math.max(-180, Math.min(180, event.clientX - dragStart.x));
      panY = Math.max(-100, Math.min(100, event.clientY - dragStart.y));
      applyTransform();
    });

    viewport.addEventListener("pointerup", event => {
      isDragging = false;
      viewport.classList.remove("dragging");
      if (viewport.hasPointerCapture(event.pointerId)) viewport.releasePointerCapture(event.pointerId);
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && isDetailOpen) closeDetailDrawer();
      if (event.key === "Escape" && processSection.classList.contains("tools-open")) {
        setProcessToolsOpen(false);
        processToolsToggle.focus({ preventScroll:true });
      }
    });

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        window.clearTimeout(autoCycleTimer);
        clearDataRefreshState();
      } else {
        restartAutoCycle();
      }
    });

    function updateClock() {
      const now = new Date();
      document.getElementById("currentTime").textContent = new Intl.DateTimeFormat("zh-CN", {
        year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", second:"2-digit", hour12:false
      }).format(now).replaceAll("/", "-");
    }

    let resizeTimer;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => { renderNodes(factories[activeFactoryId]); drawEdges(); }, 120);
    });

    let layoutResizeTimer;
    if (typeof ResizeObserver === "function") {
      const layoutObserver = new ResizeObserver(() => {
        clearTimeout(layoutResizeTimer);
        layoutResizeTimer = setTimeout(() => {
          renderNodes(factories[activeFactoryId]);
          drawEdges();
        }, 80);
      });
      layoutObserver.observe(viewport);
    }

    updateClock();
    setInterval(updateClock, 1000);
    renderAll();
    requestAnimationFrame(() => {
      showSelectedNodeAutomatically();
      restartAutoCycle();
    });
  </script>
</body>
</html>
